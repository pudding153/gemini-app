<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #btn-container {
      position: fixed;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 15px;
      background-color: #1e1e1e;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #reset-btn {
      border: 1px solid #ff4d4d;
      color: #ff4d4d;
    }

    #reset-btn:active {
      background-color: rgba(255, 77, 77, 0.2);
    }

    #error-clear-btn {
      border: 1px solid #ffb703;
      color: #ffb703;
    }

    #error-clear-btn:active {
      background-color: rgba(255, 183, 3, 0.2);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 50px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #254d32;
      color: #ffffff;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    .ai-message {
      background-color: #333333;
      color: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    .ai-message h1, .ai-message h2, .ai-message h3 {
      margin: 8px 0 4px 0;
      font-size: 1.1rem;
    }

    .ai-message strong {
      color: #3a86ff;
    }

    .ai-message code {
      background-color: #222;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    .ai-message pre {
      background-color: #222;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
    }

    .loading-message {
      color: #888888;
      font-size: 13px;
      align-self: flex-start;
      margin-left: 5px;
    }

    .input-area {
      display: flex;
      align-items: flex-end;
      padding: 10px;
      background-color: #2d2d2d;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #444444;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      resize: none;
      height: 24px;
      font-family: sans-serif;
      line-height: 1.5;
    }

    .send-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      height: 48px;
    }

    .send-btn:active {
      background-color: #2a66cc;
    }
  </style>
</head>
<body>

  <div id="btn-container">
    <button id="reset-btn" class="action-btn" onclick="clearHistory()">リセット</button>
    <button id="error-clear-btn" class="action-btn" onclick="clearLastError()">エラー履歴クリア</button>
  </div>

  <div id="chat-container"></div>

  <div class="input-area">
    <textarea id="userInput" placeholder="メッセージを入力..." oninput="adjustHeight()"></textarea>
    <button class="send-btn" onclick="sendMessage()">送信</button>
  </div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('userInput');
  
  let conversationHistory = [];
  try {
    const saved = localStorage.getItem('chatHistory');
    if (saved) {
      conversationHistory = JSON.parse(saved);
    }
  } catch (e) {
    conversationHistory = [];
  }

  function parseMarkdown(text) {
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.*?)_/g, '<em>$1</em>');
    html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    html = html.replace(/`(.*?)`/g, '<code>$1</code>');
    html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

    return html;
  }

  function renderMessage(msg) {
    const div = document.createElement('div');
    if (msg.role === 'user') {
      div.className = 'message user-message';
      div.textContent = msg.parts[0].text;
    } else if (msg.role === 'model') {
      div.className = 'message ai-message';
      div.innerHTML = parseMarkdown(msg.parts[0].text);
    }
    chatContainer.appendChild(div);
  }

  window.addEventListener('DOMContentLoaded', () => {
    conversationHistory.forEach(msg => {
      renderMessage(msg);
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });

  function clearHistory() {
    if (confirm('これまでの会話をすべて消去しますか？')) {
      localStorage.removeItem('chatHistory');
      conversationHistory = [];
      chatContainer.innerHTML = '';
    }
  }

  function clearLastError() {
    if (conversationHistory.length === 0) {
      alert('削除する履歴はありません。');
      return;
    }

    // 最後のメッセージがAIの応答でない（＝ユーザーの質問で止まっている、または不整合がある）場合
    // 直近のユーザーメッセージを1件削除してAPIエラーのループを防ぐ
    if (confirm('直近のエラー原因となった可能性のあるメッセージを履歴から削除しますか？')) {
      conversationHistory.pop(); 
      localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));
      
      // 画面の表示を再更新
      chatContainer.innerHTML = '';
      conversationHistory.forEach(msg => renderMessage(msg));
      chatContainer.scrollTop = chatContainer.scrollHeight;
      alert('直近の送信メッセージを削除しました。もう一度お試しください。');
    }
  }

  function adjustHeight() {
    userInput.style.height = '24px';
    userInput.style.height = (userInput.scrollHeight - 24) + 'px';
  }

  function typeWriter(element, text, index = 0, currentText = "") {
    if (index < text.length) {
      currentText += text.charAt(index);
      element.innerHTML = parseMarkdown(currentText);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      setTimeout(() => typeWriter(element, text, index + 1, currentText), 30);
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = text;
    chatContainer.appendChild(userDiv);

    userInput.value = '';
    userInput.style.height = '24px';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    conversationHistory.push({ role: 'user', parts: [{ text: text }] });
    localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-message';
    loadingDiv.textContent = 'Geminiが考えています...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const response = await fetch('https://gemini-app-mp93.onrender.com/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: conversationHistory })
      });
      
      if (!response.ok) {
        throw new Error('Server response error');
      }

      const data = await response.json();
      loadingDiv.remove();

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai-message';
      chatContainer.appendChild(aiDiv);

      typeWriter(aiDiv, data.text);

      conversationHistory.push({ role: 'model', parts: [{ text: data.text }] });
      localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    } catch (error) {
      loadingDiv.remove();
      
      // 通信エラーが起きた場合、直前に追加したuserメッセージを配列から取り除く（保存しない）
      if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
        conversationHistory.pop();
        localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));
      }

      const errorDiv = document.createElement('div');
      errorDiv.className = 'message ai-message';
      errorDiv.textContent = '通信エラーが発生しました。再度送信するか、エラー履歴クリアをお試しください。';
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }
</script>

</body>
</html>
