<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #reset-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 6px 12px;
      border: 1px solid #ff4d4d;
      border-radius: 15px;
      background-color: #1e1e1e;
      color: #ff4d4d;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      transition: background-color 0.2s;
    }

    #reset-btn:active {
      background-color: rgba(255, 77, 77, 0.2);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 50px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #254d32;
      color: #ffffff;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    .ai-message {
      background-color: #333333;
      color: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    .loading-message {
      color: #888888;
      font-size: 13px;
      align-self: flex-start;
      margin-left: 5px;
    }

    .input-area {
      display: flex;
      align-items: flex-end;
      padding: 10px;
      background-color: #2d2d2d;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #444444;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      resize: none;
      height: 24px;
      font-family: sans-serif;
      line-height: 1.5;
    }

    .send-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      height: 48px;
    }

    .send-btn:active {
      background-color: #2a66cc;
    }
  </style>
</head>
<body>

  <button id="reset-btn" onclick="clearHistory()">リセット</button>

  <div id="chat-container"></div>

  <div class="input-area">
    <textarea id="userInput" placeholder="メッセージを入力..." oninput="adjustHeight()"></textarea>
    <button class="send-btn" onclick="sendMessage()">送信</button>
  </div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('userInput');
  
  let conversationHistory = [];
  try {
    const saved = localStorage.getItem('chatHistory');
    if (saved) {
      conversationHistory = JSON.parse(saved);
    }
  } catch (e) {
    conversationHistory = [];
  }

  function renderMessage(msg) {
    const div = document.createElement('div');
    if (msg.role === 'user') {
      div.className = 'message user-message';
      div.textContent = msg.parts[0].text;
    } else if (msg.role === 'model') {
      div.className = 'message ai-message';
      div.textContent = msg.parts[0].text;
    }
    chatContainer.appendChild(div);
  }

  window.addEventListener('DOMContentLoaded', () => {
    conversationHistory.forEach(msg => {
      renderMessage(msg);
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });

  function clearHistory() {
    if (confirm('これまでの会話をすべて消去しますか？')) {
      localStorage.removeItem('chatHistory');
      conversationHistory = [];
      chatContainer.innerHTML = '';
    }
  }

  function adjustHeight() {
    userInput.style.height = '24px';
    userInput.style.height = (userInput.scrollHeight - 24) + 'px';
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = text;
    chatContainer.appendChild(userDiv);

    userInput.value = '';
    userInput.style.height = '24px';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    conversationHistory.push({ role: 'user', parts: [{ text: text }] });
    localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-message';
    loadingDiv.textContent = 'Geminiが考えています...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const response = await fetch('https://onrender.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: conversationHistory })
      });
      
      if (!response.ok) throw new Error();
      loadingDiv.remove();

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai-message';
      chatContainer.appendChild(aiDiv);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let displayedText = '';
      let queue = [];
      let isTyping = false;

      function startTyping() {
        if (isTyping || queue.length === 0) return;
        isTyping = true;
        
        function type() {
          if (queue.length > 0) {
            displayedText += queue.shift();
            aiDiv.textContent = displayedText;
            chatContainer.scrollTop = chatContainer.scrollHeight;
            setTimeout(type, 30);
          } else {
            isTyping = false;
          }
        }
        type();
      }

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value, { stream: true });
        fullText += chunk;
        queue.push(...chunk.split(''));
        startTyping();
      }

      while (isTyping || queue.length > 0) {
        await new Promise(resolve => setTimeout(resolve, 50));
      }

      conversationHistory.push({ role: 'model', parts: [{ text: fullText }] });
      localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    } catch (error) {
      loadingDiv.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'message ai-message';
      errorDiv.textContent = '通信エラーが発生しました。';
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }
</script>

</body>
</html>
