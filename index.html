<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #254d32;
      color: #ffffff;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    .ai-message {
      background-color: #333333;
      color: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    .loading-message {
      color: #888888;
      font-size: 13px;
      align-self: flex-start;
      margin-left: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background-color: #2d2d2d;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #444444;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 20px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background-color: #2a66cc;
    }
  </style>
</head>
<body>

  <div id="chat-container"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">送信</button>
  </div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('userInput');

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  function typeWriter(element, text, index = 0) {
    if (index < text.length) {
      element.textContent += text.charAt(index);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      setTimeout(() => typeWriter(element, text, index + 1), 30);
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = text;
    chatContainer.appendChild(userDiv);

    userInput.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-message';
    loadingDiv.textContent = 'Geminiが考えています...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const response = await fetch('https://gemini-app-mp93.onrender.com/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      
      const data = await response.json();
      loadingDiv.remove();

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai-message';
      chatContainer.appendChild(aiDiv);

      typeWriter(aiDiv, data.text);

    } catch (error) {
      loadingDiv.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'message ai-message';
      errorDiv.textContent = '通信エラーが発生しました。';
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }
</script>

</body>
</html>
