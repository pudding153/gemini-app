<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    /* 全体設定：真っ黒より少し明るい黒（#1e1e1e） */
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* トーク表示エリア */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 吹き出しの共通設定 */
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    /* ユーザー：右側・緑色系 */
    .user-message {
      background-color: #254d32;
      color: #ffffff;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    /* Gemini：左側・暗いグレー */
    .ai-message {
      background-color: #333333;
      color: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    /* 「考え中...」のうっすら表示 */
    .loading-message {
      color: #888888;
      font-size: 13px;
      align-self: flex-start;
      margin-left: 5px;
    }

    /* 入力エリア（画面下部に固定） */
    .input-area {
      display: flex;
      padding: 10px;
      background-color: #2d2d2d;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #444444;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 20px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background-color: #2a66cc;
    }
  </style>
</head>
<body>

  <!-- トーク履歴が表示されるエリア -->
  <div id="chat-container"></div>

  <!-- 下部入力エリア -->
  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">送信</button>
  </div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('userInput');

  // エンターキーでも送信できるようにする設定
  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  // 1文字ずつカタカタ表示する関数
  function typeWriter(element, text, index = 0) {
    if (index < text.length) {
      element.textContent += text.charAt(index);
      chatContainer.scrollTop = chatContainer.scrollHeight; // 文字が増えるたびに自動スクロール
      setTimeout(() => typeWriter(element, text, index + 1), 30); // 30ミリ秒間隔で表示
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // 1. ユーザーの入力を右側に追加
    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = text;
    chatContainer.appendChild(userDiv);

    // 入力欄を空にして下までスクロール
    userInput.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    // 2. 「考え中...」の文字を左側に一時表示
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-message';
    loadingDiv.textContent = 'Geminiが考えています...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      // 3. 自分の仲介サーバーに通信
      const response = await fetch('http://localhost:3000/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      
      const data = await response.json();

      // 「考え中...」を消す
      loadingDiv.remove();

      // 4. Geminiの返答枠を左側に追加（中身は空っぽで作成）
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai-message';
      chatContainer.appendChild(aiDiv);

      // 5. 返答文字をカタカタ演出で流し込む
      typeWriter(aiDiv, data.text);

    } catch (error) {
      loadingDiv.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'message ai-message';
      errorDiv.textContent = '通信エラーが発生しました。';
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }
</script>

</body>
</html>
