<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* 常に画面左上に固定するスタイル */
    #reset-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 6px 12px;
      border: 1px solid #ff4d4d;
      border-radius: 15px;
      background-color: #1e1e1e; /* スクロールした文字と被っても見やすいように背景色を指定 */
      color: #ff4d4d;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100; /* 最前面に表示 */
      transition: background-color 0.2s;
    }

    #reset-btn:active {
      background-color: rgba(255, 77, 77, 0.2);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 50px 20px 20px 20px; /* 最初のメッセージがボタンに被らないように上部余白 */
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #254d32;
      color: #ffffff;
      align-self: flex-end;
      border-top-right-radius: 2px;
    }

    .ai-message {
      background-color: #333333;
      color: #ffffff;
      align-self: flex-start;
      border-top-left-radius: 2px;
    }

    .loading-message {
      color: #888888;
      font-size: 13px;
      align-self: flex-start;
      margin-left: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background-color: #2d2d2d;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background-color: #444444;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    .send-btn {
      padding: 0 20px;
      border: none;
      border-radius: 20px;
      background-color: #3a86ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .send-btn:active {
      background-color: #2a66cc;
    }
  </style>
</head>
<body>

  <!-- 常に固定表示されるリセットボタン -->
  <button id="reset-btn" onclick="clearHistory()">リセット</button>

  <div id="chat-container"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">送信</button>
  </div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('userInput');
  
  let conversationHistory = [];
  try {
    const saved = localStorage.getItem('chatHistory');
    if (saved) {
      conversationHistory = JSON.parse(saved);
    }
  } catch (e) {
    conversationHistory = [];
  }

  function renderMessage(msg) {
    const div = document.createElement('div');
    if (msg.role === 'user') {
      div.className = 'message user-message';
      div.textContent = msg.parts.text;
    } else if (msg.role === 'model') {
      div.className = 'message ai-message';
      div.textContent = msg.parts.text;
    }
    chatContainer.appendChild(div);
  }

  window.addEventListener('DOMContentLoaded', () => {
    conversationHistory.forEach(msg => {
      renderMessage(msg);
    });
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });

  function clearHistory() {
    if (confirm('これまでの会話をすべて消去しますか？')) {
      localStorage.removeItem('chatHistory');
      conversationHistory = [];
      chatContainer.innerHTML = '';
    }
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }

  function typeWriter(element, text, index = 0) {
    if (index < text.length) {
      element.textContent += text.charAt(index);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      setTimeout(() => typeWriter(element, text, index + 1), 30);
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = text;
    chatContainer.appendChild(userDiv);

    userInput.value = '';
    chatContainer.scrollTop = chatContainer.scrollHeight;

    conversationHistory.push({ role: 'user', parts: [{ text: text }] });
    localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'loading-message';
    loadingDiv.textContent = 'Geminiが考えています...';
    chatContainer.appendChild(loadingDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const response = await fetch('https://gemini-app-mp93.onrender.com/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ history: conversationHistory })
      });
      
      const data = await response.json();
      loadingDiv.remove();

      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai-message';
      chatContainer.appendChild(aiDiv);

      typeWriter(aiDiv, data.text);

      conversationHistory.push({ role: 'model', parts: [{ text: data.text }] });
      localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));

    } catch (error) {
      loadingDiv.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'message ai-message';
      errorDiv.textContent = '通信エラーが発生しました。';
      chatContainer.appendChild(errorDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }
</script>

</body>
</html>
